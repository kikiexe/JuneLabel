worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log ke stdout/stderr agar muncul di log deployment
    access_log    /dev/stdout;
    error_log     /dev/stderr;

    sendfile      on;
    keepalive_timeout 65;

    server {
        # Port default untuk deployment biasanya 80 atau diambil dari $PORT
        listen 80;
        listen [::]:80;
        
        server_name localhost;
        
        # Root folder aplikasi Laravel
        root /app/public;
        
        index index.php index.html;
        
        charset utf-8;

        # Pengaturan Header Keamanan Standar
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
 
        location / {
            # Logic routing utama Laravel
            try_files $uri $uri/ /index.php?$query_string;
        }
 
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
 
        error_page 404 /index.php;
 
        # Handle eksekusi file PHP
        location ~ \.php$ {
            # Pastikan PHP-FPM berjalan di port 9000
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }
 
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}