# nixpacks.toml
providers = ["php", "node"]

[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_pgsql", "php83Extensions.bcmath", "php83Extensions.intl", "php83Extensions.gd", "composer", "nodejs_20"]

[phases.build]
cmds = [
    "npm install",
    "npm run build",
    "composer install --no-dev --optimize-autoloader --no-interaction --no-progress",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "chmod -R 777 storage bootstrap/cache"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && nginx -c /assets/nginx.conf"